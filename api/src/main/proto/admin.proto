syntax = "proto3";

package sorenkai.admin.v1;

option java_multiple_files = true;
option java_package = "com.sorenkai.admin.api.v1";
option java_outer_classname = "AdminProto";

service AdminService {
  rpc GetServiceInfo (ServiceInfoRequest)
      returns (ServiceInfoResponse);
  rpc GetDiagnostics(DiagnosticsRequest)
      returns (DiagnosticsResponse);
}

message ServiceInfoRequest {}

message ServiceInfoResponse {
  string service_name = 1;
  string version = 2;
  RuntimeInfo runtime = 3;
  DeploymentInfo deployment = 4;
}

message RuntimeInfo {
  string started_at = 1;
  int64 uptime_seconds = 2;
  string java_version = 3;
  int32 available_processors = 4;
}

message DeploymentInfo {
  string environment = 1;
  string revision = 2;
  string instance_id = 3;
}

message DiagnosticsRequest {}

message DiagnosticsResponse {
  JvmMemoryInfo memory = 1;
  JvmThreadInfo threads = 2;
  repeated GarbageCollectorInfo garbage_collectors = 3;
}

message JvmMemoryInfo {
  int64 heap_used_bytes = 1;
  int64 heap_committed_bytes = 2;
  int64 heap_max_bytes = 3;
  int64 non_heap_used_bytes = 4;
  int64 non_heap_committed_bytes = 5;
  int64 non_heap_max_bytes = 6;
}

message JvmThreadInfo {
  int32 live_threads = 1;
  int32 daemon_threads = 2;
  int32 peak_threads = 3;
  int64 total_started_threads = 4;
}

message GarbageCollectorInfo {
  string name = 1;
  int64 collection_count = 2;
  int64 collection_time_millis = 3;
}
